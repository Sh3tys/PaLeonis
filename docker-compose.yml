# Lance l'infrastructure PostgreSQL en local : docker compose up -d
# MongoDB n'est pas ici : il tourne à part (service mongod ou conteneur mongo:7).
services:
  # Base relationnelle. Les variables viennent du .env, avec une valeur par défaut après ":-".
  db:
    image: postgres:16-alpine
    container_name: hosting_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hosting}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      TZ: Europe/Paris
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volume nommé : les données survivent à un redémarrage du conteneur.
      - db_data:/var/lib/postgresql/data
      # Au tout premier démarrage, Postgres exécute les .sql de ce dossier par ordre alphabétique
      # (schema.sql puis seed.sql). Pour rejouer : docker compose down -v && docker compose up -d
      - ./database:/docker-entrypoint-initdb.d:ro
    # Permet à Adminer d'attendre que la base accepte vraiment les connexions.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-hosting}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Interface web pour consulter la base : http://localhost:8080 (serveur "db").
  adminer:
    image: adminer:latest
    container_name: hosting_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
